<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient matching character-card -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2a3f"/>
      <stop offset="100%" stop-color="#091825"/>
    </linearGradient>

    <!-- Portal Energy Core Gradient -->
    <linearGradient id="portalCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c1b10"/>
      <stop offset="50%" stop-color="#3d2616"/>
      <stop offset="100%" stop-color="#2c1b10"/>
    </linearGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="796" height="216" rx="6" fill="url(#bg)" stroke="#2c1b10" stroke-width="4"/>
  <rect x="8" y="8" width="784" height="204" rx="3" fill="none" stroke="#ffd98a" stroke-width="1.5" stroke-opacity="0.85"/>

  <!-- Corner Pixel Accents -->
  <rect x="8" y="8" width="8" height="8" fill="#ffd98a"/>
  <rect x="784" y="8" width="8" height="8" fill="#ffd98a"/>
  <rect x="8" y="204" width="8" height="8" fill="#ffd98a"/>
  <rect x="784" y="204" width="8" height="8" fill="#ffd98a"/>

  <!-- ========================================== -->
  <!-- LEFT: 2D ISOMETRIC PORTAL VIEWPORT (180x180) -->
  <!-- ========================================== -->
  <g transform="translate(20, 20)">
    <!-- Viewport Screen Box -->
    <rect x="0" y="0" width="180" height="180" rx="3" fill="#08141f" stroke="#334155" stroke-width="1"/>
    
    <!-- Subtle Grid Lines (Cyber / Retro Geo Grid) -->
    <line x1="0" y1="45" x2="180" y2="45" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="0" y1="90" x2="180" y2="90" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="0" y1="135" x2="180" y2="135" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="45" y1="0" x2="45" y2="180" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="90" y1="0" x2="90" y2="180" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="135" y1="0" x2="135" y2="180" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2,2"/>

    <!-- Viewport Corner Pixels -->
    <rect x="0" y="0" width="4" height="4" fill="#ffd98a"/>
    <rect x="176" y="0" width="4" height="4" fill="#ffd98a"/>
    <rect x="0" y="176" width="4" height="4" fill="#ffd98a"/>
    <rect x="176" y="176" width="4" height="4" fill="#ffd98a"/>

    <!-- Floating Island Pedestal (Isometric Tile Base) -->
    <!-- Base Bottom Layer Shadow -->
    <polygon points="90,162 145,142 90,122 35,142" fill="#061019"/>
    <!-- Base Bottom Thickness -->
    <polygon points="35,142 90,162 90,168 35,148" fill="#0f172a"/>
    <polygon points="90,162 145,142 145,148 90,168" fill="#1e293b"/>
    <!-- Base Top Surface -->
    <polygon points="90,158 140,140 90,122 40,140" fill="#1e293b" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.6"/>

    <!-- Stepped Tier 2 Base -->
    <polygon points="90,152 130,137 90,122 50,137" fill="#334155"/>
    <polygon points="50,137 90,152 90,155 50,140" fill="#1e293b"/>
    <polygon points="90,152 130,137 130,140 90,155" fill="#475569"/>

    <!-- PORTAL ARCHWAY -->
    <!-- Portal Back Wall / Energy Field Frame -->
    <polygon points="90,144 116,134 116,56 90,46" fill="#0369a1" opacity="0.3"/>
    <polygon points="90,144 64,134 64,56 90,46" fill="#0284c7" opacity="0.3"/>

    <!-- Mystical Portal Vortex (Glowing center) -->
    <path d="M 66,133 Q 90,142 114,133 L 114,58 Q 90,44 66,58 Z" fill="url(#portalCore)" filter="url(#glow)"/>

    <!-- Portal Swirl Rings (Isometric Ellipses inside gate) -->
    <ellipse cx="90" cy="94" rx="16" ry="32" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.75" stroke-dasharray="8,4"/>
    <ellipse cx="90" cy="94" rx="8" ry="18" fill="#ffffff" fill-opacity="0.85"/>

    <!-- Left Pillar (Isometric 3D Column) -->
    <!-- Pillar Front/Left face -->
    <polygon points="60,138 68,141 68,52 60,49" fill="#1e293b" stroke="#0f172a" stroke-width="0.5"/>
    <!-- Pillar Side/Right face -->
    <polygon points="68,141 74,139 74,50 68,52" fill="#334155" stroke="#0f172a" stroke-width="0.5"/>
    <!-- Pillar Top face -->
    <polygon points="60,49 66,47 74,50 68,52" fill="#475569"/>
    <!-- Pillar Gold Runic Inlay -->
    <rect x="63" y="70" width="3" height="14" fill="#ffd98a"/>
    <rect x="63" y="95" width="3" height="14" fill="#ffd98a"/>

    <!-- Right Pillar (Isometric 3D Column) -->
    <polygon points="106,139 112,141 112,52 106,50" fill="#334155" stroke="#0f172a" stroke-width="0.5"/>
    <polygon points="112,141 120,138 120,49 112,52" fill="#475569" stroke="#0f172a" stroke-width="0.5"/>
    <polygon points="106,50 112,52 120,49 114,47" fill="#64748b"/>
    <!-- Pillar Gold Runic Inlay -->
    <rect x="114" y="70" width="3" height="14" fill="#ffd98a"/>
    <rect x="114" y="95" width="3" height="14" fill="#ffd98a"/>

    <!-- Top Lintel / Arch Beam -->
    <polygon points="56,51 90,39 124,51 90,63" fill="#475569" stroke="#334155" stroke-width="0.5"/>
    <polygon points="56,51 90,63 90,68 56,56" fill="#334155"/>
    <polygon points="90,63 124,51 124,56 90,68" fill="#64748b"/>
    
    <!-- Keystone Artifact on Arch -->
    <polygon points="90,44 96,48 90,52 84,48" fill="#ffd98a"/>
    <polygon points="90,40 98,46 90,50 82,46" fill="none" stroke="#fbbf24" stroke-width="0.8"/>

    <!-- Floating Magic Crystals / Sparks (✦, ◆) -->
    <!-- Left floating crystal -->
    <polygon points="42,85 45,80 48,85 45,90" fill="#38bdf8" filter="url(#glow)"/>
    <!-- Right floating crystal -->
    <polygon points="132,75 135,70 138,75 135,80" fill="#34d399" filter="url(#glow)"/>
    <!-- Top floating rune -->
    <polygon points="88,24 90,19 92,24 90,29" fill="#ffd98a" filter="url(#glow)"/>
    
    <!-- Pixel Sparks -->
    <rect x="36" y="112" width="2" height="2" fill="#38bdf8"/>
    <rect x="144" y="118" width="2" height="2" fill="#ffd98a"/>
    <rect x="76" y="32" width="2" height="2" fill="#ffffff"/>
    <rect x="104" y="30" width="2" height="2" fill="#34d399"/>

    <!-- Mini 16-Bit Hero Silhouette on Pedestal Facing Portal -->
    <!-- Shadow -->
    <ellipse cx="90" cy="156" rx="9" ry="4" fill="#030712" opacity="0.6"/>
    <!-- Cloak / Body -->
    <rect x="87" y="142" width="6" height="11" fill="#0f172a"/>
    <!-- Cape Rim (Red / Gold) -->
    <rect x="85" y="144" width="2" height="9" fill="#991b1b"/>
    <rect x="93" y="144" width="2" height="9" fill="#991b1b"/>
    <!-- Helmet / Head -->
    <rect x="87" y="137" width="6" height="5" fill="#334155"/>
    <rect x="88" y="139" width="4" height="2" fill="#ffd98a"/>
    <!-- Sword hilt angled on back -->
    <line x1="84" y1="138" x2="88" y2="145" stroke="#ffd98a" stroke-width="1.2"/>

    <!-- Viewport Bottom Status Label -->
    <rect x="15" y="160" width="150" height="14" rx="2" fill="#091420" fill-opacity="0.85"/>
    <text x="90" y="171" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#64748b" letter-spacing="0.5">
      GATEWAY: ISOMETRIC CANVAS
    </text>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT: REALM INTEL & DIRECT CALL TO ACTION -->
  <!-- ========================================== -->
  <g font-family="'Courier New', Courier, monospace">
    <!-- Live Badge -->
    <rect x="220" y="24" width="148" height="20" rx="3" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="232" cy="34" r="3.5" fill="#34d399"/>
    <text x="242" y="38" fill="#34d399" font-size="11" font-weight="bold" letter-spacing="0.5">LIVE REALM ONLINE</text>

    <!-- World Version Tag -->
    <text x="770" y="38" text-anchor="end" fill="#ffd98a" font-size="12" font-weight="bold">ISOMETRIC WORLD v2.0</text>

    <!-- Main Realm Title -->
    <text x="220" y="70" fill="#ffd98a" font-size="17" font-weight="bold" letter-spacing="1">
      ENTER 2D ISOMETRIC REALM
    </text>

    <!-- Narrative / Description -->
    <text x="220" y="93" fill="#e2e8f0" font-size="12">
      Interactive retro RPG world with real-time isometric engine, building hubs,
    </text>
    <text x="220" y="111" fill="#94a3b8" font-size="12">
      and live verification of production architectures deployed on hardened origin.
    </text>

    <!-- Three Technical Proof Badges -->
    <!-- Badge 1: RAM Footprint -->
    <g transform="translate(220, 126)">
      <rect x="0" y="0" width="166" height="24" rx="3" fill="#0c2333" stroke="#38bdf8" stroke-width="1"/>
      <text x="10" y="16" fill="#38bdf8" font-size="11" font-weight="bold">RAM ~3.4MB (Alpine)</text>
    </g>

    <!-- Badge 2: Edge Citadel -->
    <g transform="translate(396, 126)">
      <rect x="0" y="0" width="178" height="24" rx="3" fill="#0c241c" stroke="#52b788" stroke-width="1"/>
      <text x="10" y="16" fill="#52b788" font-size="11" font-weight="bold">Citadel: HTTP 444 Drop</text>
    </g>

    <!-- Badge 3: ATS In-Memory -->
    <g transform="translate(584, 126)">
      <rect x="0" y="0" width="186" height="24" rx="3" fill="#241b09" stroke="#fbbf24" stroke-width="1"/>
      <text x="10" y="16" fill="#fbbf24" font-size="11" font-weight="bold">ATS Forge: In-Memory</text>
    </g>

    <!-- Prominent Interactive Action Button (Click to Enter) -->
    <g transform="translate(220, 162)">
      <rect x="0" y="0" width="550" height="38" rx="4" fill="url(#btnGrad)" stroke="#ffd98a" stroke-width="1.5"/>
      <rect x="3" y="3" width="544" height="32" rx="2" fill="none" stroke="#ffd98a" stroke-width="0.75" stroke-opacity="0.4"/>
      
      <!-- Button Pixel Corners -->
      <rect x="2" y="2" width="4" height="4" fill="#ffd98a"/>
      <rect x="544" y="2" width="4" height="4" fill="#ffd98a"/>
      <rect x="2" y="32" width="4" height="4" fill="#ffd98a"/>
      <rect x="544" y="32" width="4" height="4" fill="#ffd98a"/>

      <text x="275" y="24" text-anchor="middle" fill="#ffd98a" font-size="13" font-weight="bold" letter-spacing="1">
        ⚔️ CLICK TO ENTER REALM : profile.uyasky.web.id ▶
      </text>
    </g>
  </g>
</svg>